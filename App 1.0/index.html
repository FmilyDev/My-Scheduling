<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตารางเรียนของฉัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="tab-grid">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </span>
      <div>
        <h1>ตารางเรียนของฉัน</h1>
        <p class="sub">ใส่ทุก Section ที่เปิด แล้วเลือกวิชาละ 1 Section</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="button" data-action="import">นำเข้า (Import)</button>
      <button class="btn" type="button" data-action="export">ส่งออก (Export)</button>
      <button class="btn btn-primary" type="button" data-action="add">+ เพิ่มวิชา</button>
    </div>
  </header>

  <div class="status" id="status" aria-live="polite"></div>

  <nav class="tabs" aria-label="สลับมุมมอง">
    <button type="button" data-action="tab" data-tab="grid">ตารางเรียน</button>
    <button type="button" data-action="tab" data-tab="list" id="tab-list">รายวิชา</button>
  </nav>

  <main class="layout">
    <section class="course-col" id="course-col" aria-label="รายวิชา"></section>
    <section class="timetable card" id="timetable" aria-label="ตารางเรียน"></section>
  </main>

  <div id="popover-root"></div>
  <dialog id="course-dialog" aria-labelledby="dlg-title"></dialog>
  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
